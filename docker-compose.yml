# Env is injected at run time, not baked into the image.
#   docker compose up -d --build                      # uses .env.local
#   ENV_FILE=.env.prod docker compose up -d --build   # uses .env.prod
#   HOST_PORT=3001 ENV_FILE=.env.prod docker compose up -d
services:
  jira-dashboard:
    image: jira-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-.env.local}
    restart: unless-stopped
